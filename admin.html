<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — Miraj Media Induction Portal</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table-scroll { overflow-x: auto; }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .admin-tab {
    padding: 10px 18px; border-radius: 999px; border: 2px solid var(--border);
    background: #fff; color: var(--text-muted); font-weight: 700; font-size: 0.9rem;
    cursor: pointer; font-family: inherit;
  }
  .admin-tab.active { background: var(--brand-primary); color: #fff; border-color: var(--brand-primary); }
  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .status-draft { background: #EFEFEF; color: #666; }
  .status-active { background: #DFF5E6; color: #1E7A3D; }
  .status-completed { background: #E4E9F5; color: var(--brand-primary); }
  .status-select { font-size: 0.78rem; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); }
  #eventFormCard input, #eventFormCard select { margin-bottom: 10px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-row input { flex: 1; margin-bottom: 0; }
</style>
</head>
<body>

<header class="app-header">
  <a class="brand" href="index.html">
    <img src="assets/logo-miraj.png" alt="Miraj Media" class="logo" onerror="this.style.display='none'">
    <span>Admin — Miraj Media Induction Portal</span>
  </a>
</header>

<main class="container" style="max-width:1100px;">

  <section id="loginCard" class="card">
    <h2 data-i18n="admin.login">Admin Login</h2>
    <label data-i18n="admin.email">Email</label>
    <input type="text" id="loginEmail" autocomplete="username">
    <label data-i18n="admin.password">Password</label>
    <input type="text" id="loginPassword" autocomplete="current-password" style="-webkit-text-security: disc;">
    <button class="btn btn-primary" id="loginBtn" style="margin-top:16px;" data-i18n="admin.signIn">Sign In</button>
    <p id="loginError" style="color:#C0392B; display:none;"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h2 style="margin:0;" data-i18n="admin.dashboard">Dashboard</h2>
      <div>
        <button class="btn btn-outline" id="exportBtn" style="display:inline-block; width:auto; padding:10px 16px;" data-i18n="admin.export">Export CSV</button>
        <button class="btn btn-outline" id="logoutBtn" style="display:inline-block; width:auto; padding:10px 16px;" data-i18n="admin.logout">Log Out</button>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" id="tabEvents" data-i18n="admin.eventsTab">Events</button>
      <button class="admin-tab" id="tabInductees" data-i18n="admin.inducteesTab">Inductees</button>
    </div>

    <!-- EVENTS PANEL -->
    <div id="panelEvents">
      <div class="card" id="eventFormCard">
        <h3 id="eventFormHeading" data-i18n="admin.addEvent">Add Event</h3>
        <label data-i18n="admin.eventName">Event Name</label>
        <input type="text" id="newEventName">
        <label data-i18n="admin.eventCode">Code (used in certificate numbers, e.g. DXB25)</label>
        <input type="text" id="newEventCode" style="text-transform:uppercase;">
        <label data-i18n="admin.eventDate">Date</label>
        <input type="date" id="newEventDate">
        <label data-i18n="admin.eventLocation">Location</label>
        <input type="text" id="newEventLocation">
        <label data-i18n="admin.eventStatus">Status</label>
        <select id="newEventStatus">
          <option value="draft" data-i18n="admin.statusDraft">Draft</option>
          <option value="active" data-i18n="admin.statusActive">Active</option>
          <option value="completed" data-i18n="admin.statusCompleted">Completed</option>
        </select>
        <label data-i18n="admin.eventColor">Brand Colour</label>
        <input type="color" id="newEventColor" value="#1A347E" style="height:44px; padding:4px; cursor:pointer;">
        <label data-i18n="admin.eventLogo">Event Logo (optional)</label>
        <div id="currentLogoPreview" class="hidden" style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <img id="currentLogoImg" alt="" style="height:32px; width:auto; max-width:80px; object-fit:contain;">
          <label style="font-weight:400; font-size:0.85rem; margin:0; display:flex; align-items:center; gap:5px;">
            <input type="checkbox" id="removeLogoCheckbox" style="width:auto;">
            <span data-i18n="admin.removeLogo">Remove logo</span>
          </label>
        </div>
        <input type="file" id="newEventLogo" accept="image/*">
        <p id="logoUploadStatus" style="font-size:0.85rem; color:var(--text-muted); margin:4px 0 0;"></p>
        <div class="field-error" id="err-newEvent" data-i18n="admin.eventFormError">Event name and code are required.</div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button class="btn btn-primary" id="addEventBtn" style="flex:1;" data-i18n="admin.addEventBtn">Add Event</button>
          <button class="btn btn-outline hidden" id="cancelEditBtn" style="flex:0 0 auto; width:auto; padding:10px 20px;" data-i18n="admin.cancel">Cancel</button>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="admin.allEvents">All Events</h3>
        <div class="table-scroll">
          <table id="eventsTable">
            <thead>
              <tr>
                <th data-i18n="admin.eventLogo">Logo</th>
                <th data-i18n="admin.eventColor">Colour</th>
                <th data-i18n="admin.eventName">Event Name</th>
                <th data-i18n="admin.eventCodeShort">Code</th>
                <th data-i18n="admin.eventDate">Date</th>
                <th data-i18n="admin.eventLocation">Location</th>
                <th data-i18n="admin.eventStatus">Status</th>
                <th data-i18n="admin.certsIssued">Certificates Issued</th>
                <th data-i18n="admin.actions">Actions</th>
              </tr>
            </thead>
            <tbody id="eventsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- INDUCTEES PANEL -->
    <div id="panelInductees" class="hidden">
      <div class="card">
        <h3 data-i18n="admin.inductees">Inductees</h3>
        <div class="search-row">
          <input type="text" id="searchInput" data-i18n-placeholder="admin.searchPlaceholder" placeholder="Search by name, ID, or company...">
          <button class="btn btn-outline" id="searchBtn" style="width:auto; padding:10px 16px;" data-i18n="admin.search">Search</button>
          <button class="btn btn-outline" id="clearSearchBtn" style="width:auto; padding:10px 16px; display:none;" data-i18n="admin.clear">Clear</button>
        </div>
        <div style="display:flex; align-items:center; gap:12px; margin:10px 0;">
          <button class="btn btn-outline" id="deleteSelectedBtn" style="width:auto; padding:8px 14px; display:none; border-color:#C0392B; color:#C0392B;" data-i18n="admin.deleteSelected">Delete Selected</button>
        </div>
        <div class="table-scroll">
          <table id="inducteesTable">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAllCheckbox"></th>
                <th>Name</th><th>ID/Passport</th><th>Company/Sponsor</th><th>Type</th>
                <th data-i18n="admin.event">Event</th><th>Country</th><th>Language</th><th>Date</th>
                <th data-i18n="admin.actions">Actions</th>
              </tr>
            </thead>
            <tbody id="inducteesBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  const SESSION_KEY = "mm_admin_session";

  // ---------- Tabs ----------
  document.getElementById("tabEvents").addEventListener("click", () => switchTab("events"));
  document.getElementById("tabInductees").addEventListener("click", () => switchTab("inductees"));

  function switchTab(tab) {
    document.getElementById("tabEvents").classList.toggle("active", tab === "events");
    document.getElementById("tabInductees").classList.toggle("active", tab === "inductees");
    document.getElementById("panelEvents").classList.toggle("hidden", tab !== "events");
    document.getElementById("panelInductees").classList.toggle("hidden", tab !== "inductees");
    if (tab === "inductees") loadAndRenderInductees();
  }

  // ---------- Inductees ----------
  async function loadInductees() {
    const { data, error } = await supabaseClient
      .from("inductees")
      .select(`*, events ( name, code )`)
      .order("created_at", { ascending: false })
      .limit(500);
    if (error) { console.error(error); return []; }
    return data;
  }

  function eventLabel(r) {
    if (r.events && r.events.name) return r.events.name;
    return r.site_or_event || "-";
  }

  function renderInductees(rows) {
    const body = document.getElementById("inducteesBody");
    body.innerHTML = "";
    document.getElementById("selectAllCheckbox").checked = false;
    updateDeleteSelectedBtn();
    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--text-muted);" data-i18n="admin.noResults">No results</td></tr>`;
      applyStrings();
      return;
    }
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input type="checkbox" class="rowCheckbox" data-id="${r.id}"></td>
        <td>${r.full_name}</td>
        <td>${r.id_or_passport_number}</td>
        <td>${r.company_or_sponsor}</td>
        <td>${r.sponsor_type}</td>
        <td>${eventLabel(r)}</td>
        <td>${r.country || "-"}</td>
        <td>${r.induction_language}</td>
        <td>${new Date(r.induction_date).toLocaleDateString()}</td>
        <td><button type="button" class="deleteRowBtn" data-id="${r.id}" data-name="${r.full_name}" style="background:none; border:none; color:#C0392B; cursor:pointer; font-weight:600;" data-i18n="admin.delete">Delete</button></td>
      `;
      body.appendChild(tr);
    });
    applyStrings();
    attachRowHandlers();
  }

  function getSelectedIds() {
    return Array.from(document.querySelectorAll(".rowCheckbox:checked")).map(cb => cb.getAttribute("data-id"));
  }

  function updateDeleteSelectedBtn() {
    const count = getSelectedIds().length;
    const btn = document.getElementById("deleteSelectedBtn");
    if (count > 0) {
      btn.style.display = "inline-block";
      btn.textContent = `${t("admin.deleteSelected")} (${count})`;
    } else {
      btn.style.display = "none";
    }
  }

  function attachRowHandlers() {
    document.querySelectorAll(".rowCheckbox").forEach(cb => {
      cb.addEventListener("change", updateDeleteSelectedBtn);
    });
    document.querySelectorAll(".deleteRowBtn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-id");
        const name = btn.getAttribute("data-name");
        if (!confirm(`${t("admin.confirmDeleteOne")}\n\n${name}`)) return;
        try {
          await deleteInductee(id);
          if (document.getElementById("searchInput").value.trim()) {
            runSearch();
          } else {
            loadAndRenderInductees();
          }
        } catch (err) {
          console.error(err);
          alert(t("admin.deleteFailed"));
        }
      });
    });
  }

  document.getElementById("selectAllCheckbox").addEventListener("change", (e) => {
    document.querySelectorAll(".rowCheckbox").forEach(cb => { cb.checked = e.target.checked; });
    updateDeleteSelectedBtn();
  });

  document.getElementById("deleteSelectedBtn").addEventListener("click", async () => {
    const ids = getSelectedIds();
    if (ids.length === 0) return;
    if (!confirm(`${t("admin.confirmDeleteMany")}\n\n${ids.length} record(s) selected.`)) return;
    try {
      await deleteInductees(ids);
      if (document.getElementById("searchInput").value.trim()) {
        runSearch();
      } else {
        loadAndRenderInductees();
      }
    } catch (err) {
      console.error(err);
      alert(t("admin.deleteFailed"));
    }
  });

  async function loadAndRenderInductees() {
    const rows = await loadInductees();
    renderInductees(rows);
  }

  function toCsv(rows) {
    const headers = ["full_name","id_or_passport_number","company_or_sponsor","sponsor_type","site_or_event","country","induction_language","induction_date"];
    const lines = [headers.join(",")];
    rows.forEach(r => {
      const line = headers.map(h => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(",");
      lines.push(line);
    });
    return lines.join("\n");
  }

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const rows = await loadInductees();
    const csv = toCsv(rows);
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `miraj-inductees-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---------- Search ----------
  async function runSearch() {
    const term = document.getElementById("searchInput").value.trim();
    if (!term) { loadAndRenderInductees(); return; }
    document.getElementById("inducteesBody").innerHTML = `<tr><td colspan="10" style="text-align:center;"><div class="spinner"></div></td></tr>`;
    try {
      const rows = await searchInductees(term, 200);
      renderInductees(rows);
      document.getElementById("clearSearchBtn").style.display = "inline-block";
    } catch (err) {
      console.error(err);
      document.getElementById("inducteesBody").innerHTML = `<tr><td colspan="10" style="text-align:center; color:#C0392B;">Search failed — check your connection.</td></tr>`;
    }
  }

  document.getElementById("searchBtn").addEventListener("click", runSearch);
  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });
  document.getElementById("clearSearchBtn").addEventListener("click", () => {
    document.getElementById("searchInput").value = "";
    document.getElementById("clearSearchBtn").style.display = "none";
    loadAndRenderInductees();
  });

  // ---------- Events ----------
  let allEventsCache = [];
  let editingEventId = null;

  function statusBadge(status) {
    const key = "admin.status" + status.charAt(0).toUpperCase() + status.slice(1);
    return `<span class="status-badge status-${status}" data-i18n="${key}">${status}</span>`;
  }

  async function loadAndRenderEvents() {
    const body = document.getElementById("eventsBody");
    body.innerHTML = `<tr><td colspan="9" style="text-align:center;"><div class="spinner"></div></td></tr>`;
    try {
      const events = await getAllEvents();
      allEventsCache = events;
      body.innerHTML = "";
      if (!events.length) {
        body.innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--text-muted);" data-i18n="admin.noEvents">No events yet — add one above.</td></tr>`;
        applyStrings();
        return;
      }
      events.forEach(ev => {
        const tr = document.createElement("tr");
        const dateStr = ev.event_date ? new Date(ev.event_date).toLocaleDateString() : "-";
        const logoCell = ev.logo_url
          ? `<img src="${ev.logo_url}" alt="${ev.name} logo" style="height:32px; width:auto; max-width:60px; object-fit:contain;">`
          : `<span style="color:var(--text-muted);">-</span>`;
        const swatch = `<span style="display:inline-block; width:20px; height:20px; border-radius:4px; background:${ev.brand_color || "#ccc"}; border:1px solid rgba(0,0,0,0.15);" title="${ev.brand_color || ""}"></span>`;
        tr.innerHTML = `
          <td>${logoCell}</td>
          <td>${swatch}</td>
          <td>${ev.name}</td>
          <td>${ev.code}</td>
          <td>${dateStr}</td>
          <td>${ev.location || "-"}</td>
          <td>
            <select class="status-select" data-event-id="${ev.id}">
              <option value="draft" ${ev.status === "draft" ? "selected" : ""}>Draft</option>
              <option value="active" ${ev.status === "active" ? "selected" : ""}>Active</option>
              <option value="completed" ${ev.status === "completed" ? "selected" : ""}>Completed</option>
            </select>
          </td>
          <td>${ev.cert_sequence}</td>
          <td style="white-space:nowrap;">
            <button type="button" class="editEventBtn" data-id="${ev.id}" style="background:none; border:none; color:var(--brand-primary); cursor:pointer; font-weight:600; margin-inline-end:10px;" data-i18n="admin.edit">Edit</button>
            <button type="button" class="deleteEventBtn" data-id="${ev.id}" style="background:none; border:none; color:#C0392B; cursor:pointer; font-weight:600;" data-i18n="admin.delete">Delete</button>
          </td>
        `;
        body.appendChild(tr);
      });
      body.querySelectorAll(".status-select").forEach(sel => {
        sel.addEventListener("change", async () => {
          const eventId = sel.getAttribute("data-event-id");
          sel.disabled = true;
          try {
            await updateEventStatus(eventId, sel.value);
          } catch (err) {
            console.error(err);
            alert("Could not update status — check your connection and try again.");
          }
          sel.disabled = false;
        });
      });
      body.querySelectorAll(".editEventBtn").forEach(btn => {
        btn.addEventListener("click", () => {
          const ev = allEventsCache.find(e => e.id === btn.getAttribute("data-id"));
          if (ev) startEditEvent(ev);
        });
      });
      body.querySelectorAll(".deleteEventBtn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const ev = allEventsCache.find(e => e.id === btn.getAttribute("data-id"));
          if (!ev) return;
          const hasCerts = ev.cert_sequence > 0;
          const message = hasCerts
            ? `${t("admin.confirmDeleteEventWithCerts")}\n\n"${ev.name}" — ${ev.cert_sequence} ${t("admin.certsIssued")}`
            : `${t("admin.confirmDeleteEvent")}\n\n"${ev.name}"`;
          if (!confirm(message)) return;
          btn.disabled = true;
          try {
            await deleteEvent(ev.id);
            if (editingEventId === ev.id) cancelEdit();
            await loadAndRenderEvents();
          } catch (err) {
            console.error(err);
            alert(t("admin.deleteFailed"));
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      console.error(err);
      body.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#C0392B;">Could not load events.</td></tr>`;
    }
  }

  // ---------- Edit event ----------
  function startEditEvent(ev) {
    editingEventId = ev.id;
    document.getElementById("newEventName").value = ev.name || "";
    document.getElementById("newEventCode").value = ev.code || "";
    document.getElementById("newEventDate").value = ev.event_date || "";
    document.getElementById("newEventLocation").value = ev.location || "";
    document.getElementById("newEventStatus").value = ev.status || "draft";
    document.getElementById("newEventColor").value = ev.brand_color || "#1A347E";
    document.getElementById("newEventLogo").value = "";
    document.getElementById("removeLogoCheckbox").checked = false;

    const preview = document.getElementById("currentLogoPreview");
    if (ev.logo_url) {
      document.getElementById("currentLogoImg").src = ev.logo_url;
      preview.classList.remove("hidden");
    } else {
      preview.classList.add("hidden");
    }

    document.getElementById("eventFormHeading").textContent = t("admin.editEvent") + `: ${ev.name}`;
    document.getElementById("addEventBtn").textContent = t("admin.saveChanges");
    document.getElementById("cancelEditBtn").classList.remove("hidden");
    document.getElementById("err-newEvent").classList.remove("show");
    document.getElementById("eventFormCard").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function cancelEdit() {
    editingEventId = null;
    document.getElementById("newEventName").value = "";
    document.getElementById("newEventCode").value = "";
    document.getElementById("newEventDate").value = "";
    document.getElementById("newEventLocation").value = "";
    document.getElementById("newEventStatus").value = "draft";
    document.getElementById("newEventColor").value = "#1A347E";
    document.getElementById("newEventLogo").value = "";
    document.getElementById("removeLogoCheckbox").checked = false;
    document.getElementById("currentLogoPreview").classList.add("hidden");
    document.getElementById("eventFormHeading").setAttribute("data-i18n", "admin.addEvent");
    applyStrings();
    document.getElementById("addEventBtn").setAttribute("data-i18n", "admin.addEventBtn");
    applyStrings();
    document.getElementById("cancelEditBtn").classList.add("hidden");
    document.getElementById("err-newEvent").classList.remove("show");
  }

  document.getElementById("cancelEditBtn").addEventListener("click", cancelEdit);

  document.getElementById("addEventBtn").addEventListener("click", async () => {
    const name = document.getElementById("newEventName").value.trim();
    const code = document.getElementById("newEventCode").value.trim();
    const errEl = document.getElementById("err-newEvent");
    const statusEl = document.getElementById("logoUploadStatus");
    errEl.classList.remove("show");
    statusEl.textContent = "";

    if (!name || !code) {
      errEl.classList.add("show");
      return;
    }

    const btn = document.getElementById("addEventBtn");
    btn.disabled = true;
    try {
      const logoFile = document.getElementById("newEventLogo").files[0];
      const removeLogo = document.getElementById("removeLogoCheckbox").checked;
      let logoUrl;
      if (logoFile) {
        statusEl.textContent = t("admin.uploadingLogo");
        logoUrl = await uploadEventLogo(logoFile, code);
        statusEl.textContent = "";
      } else if (removeLogo) {
        logoUrl = null;
      }
      // else: logoUrl stays undefined — updateEvent leaves the existing
      // logo untouched; createEvent treats undefined as "no logo" below.

      const eventFields = {
        name,
        code,
        status: document.getElementById("newEventStatus").value,
        eventDate: document.getElementById("newEventDate").value || null,
        location: document.getElementById("newEventLocation").value.trim() || null,
        brandColor: document.getElementById("newEventColor").value
      };

      if (editingEventId) {
        await updateEvent(editingEventId, { ...eventFields, logoUrl });
        cancelEdit();
      } else {
        await createEvent({ ...eventFields, logoUrl: logoUrl || null });
        document.getElementById("newEventName").value = "";
        document.getElementById("newEventCode").value = "";
        document.getElementById("newEventDate").value = "";
        document.getElementById("newEventLocation").value = "";
        document.getElementById("newEventStatus").value = "draft";
        document.getElementById("newEventColor").value = "#1A347E";
        document.getElementById("newEventLogo").value = "";
      }
      await loadAndRenderEvents();
    } catch (err) {
      console.error(err);
      statusEl.textContent = "";
      errEl.textContent = err.message && err.message.includes("duplicate")
        ? "That event code is already in use — pick a different one."
        : "Could not save event — check your connection and try again.";
      errEl.classList.add("show");
    }
    btn.disabled = false;
  });

  // ---------- Login ----------
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.style.display = "none";

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = "block";
      return;
    }
    showDashboard();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    location.reload();
  });

  async function showDashboard() {
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    await loadAndRenderEvents();
  }

  (async () => {
    await loadLanguage(getSavedOrDefaultLanguage());
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) showDashboard();
  })();
</script>
